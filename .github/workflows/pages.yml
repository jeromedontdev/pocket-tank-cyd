name: CYD website and playable browser game
on:
  push:
    branches: [main]
    paths: ["web/**", "common/**", "sim/**", "docs/media/cyd-features/**", "tools/prepare_web_installer.py", "tools/build_browser.py", "tools/test_browser.cjs", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cyd-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build website and game from the released source, never main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
      - run: python tools/prepare_web_installer.py
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.18"
      - name: Restore pinned cJSON for the standalone browser build
        run: git clone --branch v1.7.19 --depth 1 https://github.com/DaveGamble/cJSON.git .browser-tools/cJSON
      - run: python tools/build_browser.py --out _site
      - name: Require browser and installer release versions to match
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p = Path('_site')
          b = json.loads((p/'play-build.json').read_text())
          f = json.loads((p/'manifest.json').read_text())
          e = json.loads((p/'elegoo-manifest.json').read_text())
          u = json.loads((p/'update.json').read_text())
          eu = json.loads((p/'elegoo-update.json').read_text())
          tag = os.environ['RELEASE_TAG']
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.check_output(['git', 'rev-parse', tag+'^{commit}'], text=True).strip()
          assert b['version'] == f['version'] and tag == 'v'+f['version'] and commit == tagged and b.get('commit', commit) == commit, 'Browser/installer release mismatch'
          assert e['version'] == u['version'] == eu['version'] == f['version'], 'Board installer versions differ'
          assert u['board'] == 'cyd2432s028' and eu['board'] == 'elegoo28', 'Board identities differ'
          b.update(release=tag, commit=commit)
          (p/'play-build.json').write_text(json.dumps(b)+'\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Verify actual browser gameplay and durable saves
        run: |
          npm install --prefix .browser-tools --no-save playwright@1.56.1
          .browser-tools/node_modules/.bin/playwright install --with-deps chromium
          node tools/test_browser.cjs
          node tools/test_usb_installer.cjs
      - name: Reject deployment if latest stable release changed during the build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: test "$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)" = "$RELEASE_TAG"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
