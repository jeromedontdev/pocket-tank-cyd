name: CYD checks
on: [push, pull_request]
jobs:
  cyd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: firmware
          command: idf.py -B build_cyd build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python tools/test_tank_backup.py --cc gcc
      - run: python tools/test_tank_backup.py --cc gcc --flat-edges
      - run: python tools/test_cyd_display.py --cc gcc
      - run: python tools/test_weather.py --cc gcc
      - run: python sim/run.py --cc gcc --smoke
