name: CYD checks
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.18"
      - run: git clone --branch v1.7.19 --depth 1 https://github.com/DaveGamble/cJSON.git .browser-tools/cJSON
      - run: python tools/build_browser.py --out _site
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - run: |
          npm install --prefix .browser-tools --no-save playwright@1.56.1
          .browser-tools/node_modules/.bin/playwright install --with-deps chromium
          node tools/test_browser.cjs
          node --input-type=module -e "import('./tools/test_usb_updater.mjs').then(m=>m.runTests()).then(console.log)"
  cyd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: firmware
          command: idf.py -B build_cyd -DPT_BOARD_VARIANT=cyd build && idf.py -B build_elegoo -DSDKCONFIG=build_elegoo/sdkconfig -DPT_BOARD_VARIANT=elegoo build && idf.py -B build_unified -DSDKCONFIG=build_unified/sdkconfig -DPT_BOARD_VARIANT=unified build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: python tools/test_tank_backup.py --cc gcc
      - run: python tools/test_tank_backup.py --cc gcc --flat-edges
      - run: python tools/test_setup_placement.py
      - run: python tools/test_wardrobe.py --cc gcc
      - run: python tools/test_frame_pacing.py --cc gcc
      - run: python tools/test_fish_behavior.py --cc gcc
      - run: python tools/test_companion_feedback.py --cc gcc
      - run: python tools/test_rpg.py --cc gcc
      - run: python tools/test_page_art.py --cc gcc
      - run: python tools/test_page_art.py --cc gcc --board elegoo
      - run: python tools/test_renderer_stress.py --cc gcc --embedded-icons --frames 1200 --seconds 30
      - run: python tools/test_creative.py --cc gcc
      - run: python tools/test_profiles.py --cc gcc
      - run: python tools/test_profile_storage.py --cc gcc
      - run: python tools/test_internal_tanks.py --cc gcc
      - run: python tools/test_cyd_display.py --cc gcc
      - run: python tools/test_cyd_sd_init.py --cc gcc
      - run: python tools/test_cyd_sd_backup.py --cc gcc
      - run: python tools/test_cyd_settings.py --cc gcc
      - run: python tools/test_cyd_touch_defaults.py --cc gcc
      - run: python tools/test_board_hardware.py --cc gcc
      - run: python tools/test_ambient.py --cc gcc
      - run: python tools/test_brightness.py --cc gcc
      - run: python tools/test_weather.py --cc gcc
      - run: python tools/test_ota.py --cc gcc
      - run: python sim/run.py --cc gcc --smoke
