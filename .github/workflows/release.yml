name: CYD release
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
permissions:
  contents: write
  actions: write
concurrency:
  group: cyd-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CYD release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os,sys; sys.path.insert(0,'tools'); from package_cyd_release import release_version; release_version(os.environ['RELEASE_TAG'])"
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32
          path: firmware
          command: idf.py -B build_cyd -DPT_BOARD_VARIANT=cyd build && idf.py -B build_elegoo -DSDKCONFIG=build_elegoo/sdkconfig -DPT_BOARD_VARIANT=elegoo build && idf.py -B build_unified -DSDKCONFIG=build_unified/sdkconfig -DPT_BOARD_VARIANT=unified build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test tools and actual CYD renderer
        run: |
          python -m unittest discover -s tools -p "test_*.py"
          python tools/test_tank_backup.py --cc gcc
          python tools/test_tank_backup.py --cc gcc --flat-edges
          python tools/test_setup_placement.py
          python tools/test_wardrobe.py --cc gcc
          python tools/test_frame_pacing.py --cc gcc
          python tools/test_rpg.py --cc gcc
          python tools/test_page_art.py --cc gcc
          python tools/test_page_art.py --cc gcc --board elegoo
          python tools/test_renderer_stress.py --cc gcc --embedded-icons --frames 1200 --seconds 30
          python tools/test_creative.py --cc gcc
          python tools/test_profiles.py --cc gcc
          python tools/test_profile_storage.py --cc gcc
          python tools/test_internal_tanks.py --cc gcc
          python tools/test_cyd_display.py --cc gcc
          python tools/test_cyd_sd_init.py --cc gcc
          python tools/test_cyd_sd_backup.py --cc gcc
          python tools/test_cyd_touch_defaults.py --cc gcc
          python tools/test_board_hardware.py --cc gcc
          python tools/test_cyd_settings.py --cc gcc
          python tools/test_ambient.py --cc gcc
          python tools/test_brightness.py --cc gcc
          python tools/test_weather.py --cc gcc
          python tools/test_ota.py --cc gcc
          python sim/run.py --cc gcc --smoke
      - name: Package verified firmware
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install esptool==5.6.0 esp-idf-nvs-partition-gen==0.1.9
          python tools/package_cyd_release.py --build firmware/build_cyd --out dist/cyd --version "$RELEASE_TAG"
          python tools/package_cyd_release.py --board elegoo --build firmware/build_elegoo --out dist/elegoo --version "$RELEASE_TAG"
          python tools/package_cyd_release.py --board unified --build firmware/build_unified --out dist/unified --version "$RELEASE_TAG"
          python tools/prepare_web_installer.py --bundles dist --version "$RELEASE_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Verify staged installer and legacy-to-unified USB migration before publication
        run: |
          npm install --prefix .browser-tools --no-save playwright@1.56.1
          .browser-tools/node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module -e "import('./tools/test_usb_updater.mjs').then(m=>m.runTests()).then(console.log)"
          node tools/test_usb_installer.cjs
          node tools/test_usb_migration.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: cyd-release
          path: dist/**/*
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/cyd/* dist/elegoo/* dist/unified/* --verify-tag --latest \
            --title "Pocket Tank CYD ${RELEASE_TAG#v}" --notes-file dist/cyd/RELEASE-NOTES.md
          gh workflow run pages.yml --ref main
